<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Boletim de Sondagem Offline</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.js"></script>
  <script>
    stlite.mount({
      requirements: ["supabase"],
      entrypoint: "app.py",
      files: {
        "app.py": `
import streamlit as st
from supabase import create_client

# Configurações do Supabase com suas credenciais
SUPABASE_URL = "https://lfapajdngdbuszspnkbn.supabase.co"
SUPABASE_KEY = "sb_publishable_le-TPHk6g66VUq_jx_BP1Q_O9LfaPwb"

st.set_page_config(page_title="Boletim de Sondagem", page_icon="🏗️", layout="centered")

st.title("🏗️ Boletim de Sondagem SPT")

# Inicializa a memória temporária do aparelho
if "furos_locais" not in st.session_state:
    st.session_state.furos_locais = []

# --- FORMULÁRIO DE CAMPO ---
with st.form("form_sondagem", clear_on_submit=True):
    st.subheader("📋 Novo Registro de Campo")
    
    col1, col2 = st.columns(2)
    with col1:
        furo_id = st.text_input("Identificação do Furo", placeholder="Ex: SP-01")
        profundidade = st.number_input("Profundidade (m)", min_value=0.0, step=0.5, format="%.2f")
    
    with col2:
        spt = st.number_input("Número de Golpes (SPT)", min_value=0, step=1)
        tipo_solo = st.selectbox(
            "Classificação do Solo", 
            ["Argila", "Argila Arenosa", "Areia", "Areia Argilosa", "Silte", "Alteração de Rocha", "Rocha"]
        )
    
    salvar = st.form_submit_button("💾 Salvar no Aparelho (Offline)")

if salvar:
    if not furo_id:
        st.warning("Preencha a identificação do furo antes de salvar.")
    else:
        novo_registro = {
            "furo_id": furo_id,
            "profundidade_m": profundidade,
            "spt_golpes": spt,
            "tipo_solo": tipo_solo
        }
        st.session_state.furos_locais.append(novo_registro)
        st.success(f"Registro do furo **{furo_id}** salvo no aparelho!")

# --- PAINEL DE SINCRONIZAÇÃO ---
st.divider()
qtd_pendente = len(st.session_state.furos_locais)
st.subheader(f"📦 Boletins Pendentes no Aparelho: {qtd_pendente}")

if qtd_pendente > 0:
    st.dataframe(st.session_state.furos_locais, use_container_width=True)
    
    if st.button("🔄 Sincronizar com a Nuvem agora", type="primary"):
        try:
            supabase = create_client(SUPABASE_URL, SUPABASE_KEY)
            supabase.table("boletins").insert(st.session_state.furos_locais).execute()
            
            st.session_state.furos_locais = []
            st.balloons()
            st.success("Sincronizado com sucesso! Todos os dados foram gravados no Supabase.")
            st.rerun()
        except Exception as e:
            st.error(f"Erro ao sincronizar. Verifique a conexão com a internet. Detalhes: {e}")
else:
    st.info("Nenhum registro pendente de envio.")
`
      }
    }, document.getElementById("root"));
  </script>
</body>
</html>
