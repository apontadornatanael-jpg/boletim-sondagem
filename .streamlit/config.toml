[theme]
primaryColor = "#2563EB"              # Azul vibrante (amigável) para botões
backgroundColor = "#F1F5F9"           # Fundo geral cinza-azulado bem claro e limpo
secondaryBackgroundColor = "#E2E8F0"  # Fundo das caixas e barra lateral (suave e destacado)
textColor = "#1E293B"                 # Texto escuro (excelente contraste para leitura)
font = "sans serif"
